<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="โปรแกรมจัดทีมปาร์ตี้ Ragnarok The New World">
<title>จัดทีมปาร์ตี้ · Ragnarok The New World</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%94%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=Prompt:wght@500;600;700&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#e8ecf2; --surface:#ffffff; --surface2:#f1f4f8; --ink:#18212f; --muted:#667388; --line:#d3dae5;
  --brand:#34517a; --brand-ink:#ffffff; --over:rgba(52,81,122,.14); --danger:#c0392b;
  --shadow:0 1px 2px rgba(24,33,47,.06),0 6px 18px rgba(24,33,47,.06);
  --r-tank:#3b82f6; --r-dps:#e5484d; --r-heal:#2fa866; --r-sup:#9b5de5;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10151f; --surface:#192130; --surface2:#222c3e; --ink:#e8edf6; --muted:#96a3b8; --line:#2f3b52;
    --brand:#7fa3d8; --brand-ink:#0e1522; --over:rgba(127,163,216,.18); --danger:#ff7b6b;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10151f; --surface:#192130; --surface2:#222c3e; --ink:#e8edf6; --muted:#96a3b8; --line:#2f3b52;
  --brand:#7fa3d8; --brand-ink:#0e1522; --over:rgba(127,163,216,.18); --danger:#ff7b6b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Noto Sans Thai","Sarabun",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:"Prompt","Noto Sans Thai",system-ui,sans-serif;margin:0;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
body.is-dragging,body.is-dragging *{cursor:grabbing!important;user-select:none;-webkit-user-select:none}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1700px;margin:0 auto;padding:14px 16px 4px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:40px;height:40px;border-radius:11px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-size:20px;flex:none}
.brand h1{font-size:19px;line-height:1.2}
.brand p{margin:0;color:var(--muted);font-size:12px}
.top-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 12px;font-weight:500;line-height:1.4;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:3px 9px;font-size:12.5px}
.icon{border:0;background:transparent;color:var(--muted);border-radius:6px;width:24px;height:24px;display:grid;place-items:center;flex:none;padding:0;font-size:13px}
.icon:hover{background:var(--surface2);color:var(--ink)}

/* layout */
.app{display:grid;grid-template-columns:310px minmax(0,1fr);gap:16px;padding:10px 16px 28px;max-width:1700px;margin:0 auto;align-items:start}
.side{position:sticky;top:calc(12px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;max-height:calc(100vh - 24px - env(safe-area-inset-top,0px));background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-height:0}
.side-head{padding:14px 14px 10px;display:flex;flex-direction:column;gap:9px;border-bottom:1px solid var(--line)}
.side-head h2{font-size:15px;display:flex;justify-content:space-between;align-items:baseline}
.side-head h2 span{font:500 12px "Noto Sans Thai",sans-serif;color:var(--muted)}
.addform{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.addform .btn{grid-column:1/-1}
input[type=text],input[type=search],input[type=email],input[type=password],select,textarea{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:6px 9px;min-width:0}
textarea{resize:vertical;font-size:13px}
.chk{display:flex;gap:7px;align-items:center;color:var(--muted);font-size:12.5px}
.chk input{margin:0}
.row{display:flex;gap:8px;align-items:center}
.roster-list{overflow:auto;padding:10px;display:flex;flex-direction:column;gap:6px;flex:1;min-height:120px;border-radius:0 0 14px 14px}
.roster-list.over{background:var(--over);outline:2px dashed var(--brand);outline-offset:-4px}
.empty-note{color:var(--muted);text-align:center;padding:22px 10px;font-size:13px}
.side-foot{padding:9px 14px 12px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}

/* member chip */
.mem{display:flex;align-items:center;gap:7px;padding:5px 6px 5px 3px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--rc,var(--muted));border-radius:8px;cursor:grab;user-select:none;-webkit-user-select:none;min-width:0;touch-action:pan-y;-webkit-touch-callout:none}
.mem:hover{border-color:color-mix(in srgb,var(--rc,var(--muted)) 60%,var(--line));border-left-color:var(--rc,var(--muted))}
.mem.ghosted{opacity:.3}
.grip{touch-action:none;color:var(--muted);padding:4px 2px;letter-spacing:-3px;font-size:13px;line-height:1;flex:none;cursor:grab}
.badge{flex:none;width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font:600 11px "Prompt",sans-serif;background:color-mix(in srgb,var(--rc,var(--muted)) 24%,var(--surface));color:var(--ink)}
.mt{display:flex;flex-direction:column;min-width:0;flex:1;line-height:1.25}
.mt b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt small{color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:10.5px;padding:1px 7px;border-radius:99px;background:var(--over);color:var(--brand);font-weight:600;flex:none}
.badge.has-img{width:34px;height:34px;background:transparent;border-radius:0}
.badge img{width:100%;height:100%;object-fit:contain;pointer-events:none;-webkit-user-drag:none}
.jic{width:38px;height:38px;border:1.5px dashed var(--line);border-radius:8px;display:grid;place-items:center;cursor:pointer;color:var(--muted);overflow:hidden;background:var(--surface2)}
.jic:hover{border-color:var(--brand)}
.jic img{width:100%;height:100%;object-fit:contain}
.rstat{display:flex;flex-direction:column;gap:6px}
.rtot{font-size:13px;color:var(--muted)}
.rtot b{font:600 22px "Prompt","Noto Sans Thai",sans-serif;color:var(--ink);margin-right:4px}
.rsub{color:var(--muted);font-size:12.5px}
.rsub b{color:var(--ink)}
.rstat .rolechips{gap:5px}
.rstat .rc{padding:1px 8px;font-size:12px}
.tag.dup{background:color-mix(in srgb,var(--danger) 18%,transparent);color:var(--danger)}
.mem .x{opacity:.55}
.mem .x:hover{opacity:1;color:var(--danger)}
.drag-ghost{position:fixed;z-index:1000;pointer-events:none;box-shadow:0 10px 28px rgba(0,0,0,.28);transform:rotate(2deg);background:var(--surface)}

/* tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;scrollbar-width:thin}
.tab{flex:none;display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;font-weight:500;border-bottom:3px solid var(--tc)}
.tab small{color:var(--muted);font-weight:400}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink);border-bottom-color:var(--tc)}
.tab.on small{color:inherit;opacity:.7}
.tab.add{border-style:dashed;color:var(--muted);border-bottom-width:1px}

/* team */
.team-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--act);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.th-left{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0;flex:1}
.act-ico{font-size:24px;line-height:1}
.tname{font:600 18px "Prompt","Noto Sans Thai",sans-serif;background:transparent;border:1px solid transparent;border-radius:8px;padding:3px 8px;width:min(240px,100%)}
.tname:hover,.tname:focus{border-color:var(--line);background:var(--surface2)}
.actsel{width:auto;min-width:150px;font-weight:500}
.th-right{display:flex;gap:6px;flex-wrap:wrap}
.stats{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin:12px 2px}
.meter{flex:1 1 180px;min-width:150px;max-width:340px}
.meter .lbl{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:3px}
.meter .lbl b{color:var(--ink)}
.bar{height:7px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--act);border-radius:99px;transition:width .2s}
.rolechips{display:flex;gap:6px;flex-wrap:wrap}
.rc{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;padding:2px 9px;border-radius:99px;background:var(--surface);border:1px solid var(--line)}
.rc i{width:9px;height:9px;border-radius:50%}

.parties{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.party{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--act);border-radius:12px;padding:9px 9px 10px;box-shadow:var(--shadow)}
.party.full{border-top-color:var(--r-heal)}
.party>header{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.pname{font:600 14px "Prompt","Noto Sans Thai",sans-serif;background:transparent;border:1px solid transparent;border-radius:6px;padding:2px 6px;flex:1;min-width:0}
.pname:hover,.pname:focus{border-color:var(--line);background:var(--surface2)}
.dots{display:flex;gap:2px}
.dots i{width:7px;height:7px;border-radius:50%}
.cnt{font-size:12px;color:var(--muted);font-weight:600;min-width:28px;text-align:right}
.party.full .cnt{color:var(--r-heal)}
.slots{display:flex;flex-direction:column;gap:5px}
.slot{display:flex;align-items:center;gap:5px;border-radius:9px;padding:1px;min-height:42px}
.slot .no{width:18px;text-align:center;font-size:11px;color:var(--muted);flex:none}
.crown{width:22px;height:22px;flex:none;border:0;background:transparent;border-radius:6px;padding:0;font-size:14px;line-height:1;filter:grayscale(1);opacity:.35}
.crown:hover{opacity:.9;background:var(--surface2)}
.crown.on{filter:none;opacity:1}
.slot.is-head .mem{box-shadow:0 0 0 1.5px #d9a026;background:color-mix(in srgb,#d9a026 12%,var(--surface))}
.phead{font-size:12.5px;margin:0 0 7px;padding:3px 8px;border-radius:7px;background:color-mix(in srgb,#d9a026 18%,var(--surface))}
.phead.none{background:transparent;color:var(--muted);padding-left:2px}
.slot .mem{flex:1}
.empty{flex:1;height:40px;border:1.5px dashed var(--line);background:transparent;color:var(--muted);border-radius:8px;font-size:12.5px}
.empty:hover{border-color:var(--brand);color:var(--brand);background:var(--over)}
.over{background:var(--over);outline:2px dashed var(--brand);outline-offset:1px}
.party.over{outline-offset:2px}

.reserve{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:var(--shadow);border-left:5px solid var(--muted)}
.reserve>header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}
.reserve h3{font-size:14.5px}
.reserve h3 small{font:400 12px "Noto Sans Thai",sans-serif;color:var(--muted);margin-left:6px}
.res-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px}
.res-empty{color:var(--muted);font-size:13px;padding:8px 2px}

/* modal + toast */
.overlay{position:fixed;inset:0;z-index:500;background:rgba(10,14,22,.55);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.overlay[hidden]{display:none}
.dlg{background:var(--surface);border:1px solid var(--line);border-radius:14px;width:min(520px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.dlg h3{padding:16px 18px 6px;font-size:17px}
.dlg-body{padding:8px 18px 12px;overflow:auto;display:flex;flex-direction:column;gap:10px}
.dlg-foot{display:flex;justify-content:flex-end;gap:8px;padding:10px 18px 16px;flex-wrap:wrap}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.help{font-size:12.5px;color:var(--muted);margin:0}
.pick-list{display:flex;flex-direction:column;gap:5px;max-height:48vh;overflow:auto}
.pick-item{text-align:left;background:transparent;border:0;padding:0;border-radius:8px}
.pick-item .mem{cursor:pointer}
.pick-item:hover .mem{background:var(--surface2)}
.jrow{display:grid;grid-template-columns:38px 1fr 112px 34px 30px;gap:6px;align-items:center}
.jcol{width:34px;height:34px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);cursor:pointer}
.arow{display:grid;grid-template-columns:60px 1fr 30px;gap:6px;align-items:center}
.arow .ai{text-align:center}
.dsec{display:flex;flex-direction:column;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface2)}
.dsec .help{margin:0}
.side-head .row{flex-wrap:wrap}
.locs{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.loc{font:inherit;font-size:11px;line-height:1.35;padding:1px 7px;border-radius:99px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.loc:hover{border-color:var(--brand)}
.loc.none{color:var(--muted);border-style:dashed;cursor:default;background:transparent}
.loc.more{cursor:default;color:var(--muted)}
.loc.bad{border-color:var(--danger);color:var(--danger);background:color-mix(in srgb,var(--danger) 10%,var(--surface))}
.rc.warnbtn{font:inherit;font-size:12.5px;cursor:pointer;color:var(--danger);border-color:var(--danger)}
.ckrow{display:grid;grid-template-columns:170px 1fr;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.ckrow.bad{border-left:4px solid var(--danger)}
.ckn{display:flex;flex-direction:column;min-width:0}
.ckn small{color:var(--muted)}
.ckl{display:flex;flex-direction:column;gap:5px}
.ckg{display:flex;flex-wrap:wrap;align-items:center;gap:5px;font-size:12.5px}
.ckg .loc{font-size:12px}
.party.flash{animation:flashp 1.1s ease-in-out 2}
@keyframes flashp{0%,100%{box-shadow:var(--shadow)}50%{box-shadow:0 0 0 4px var(--brand)}}
@media (max-width:600px){.ckrow{grid-template-columns:1fr}}
.tlist{display:flex;flex-direction:column;gap:4px;max-height:190px;overflow:auto}
.tpick{display:flex;align-items:center;gap:8px;padding:5px 9px;border-radius:8px;background:var(--surface);border:1px solid var(--line);color:var(--ink);cursor:pointer}
.tpick small{margin-left:auto;color:var(--muted);font-size:12px}
.who{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);flex-wrap:wrap;margin-right:4px}
.who .pill{padding:3px 10px;border-radius:99px;font-weight:600;background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.who .pill.adm{background:color-mix(in srgb,#d9a026 22%,var(--surface))}
.ro-only{display:none}
.ro .ro-only{display:inline}
.ro .adm-only{display:none!important}
.ro .addform,.ro [data-act="bulk"],.ro [data-act="editmem"],.ro [data-act="rmslot"],.ro [data-act="rmres"],.ro [data-act="pickres"],.ro [data-act="dupteam"],.ro [data-act="clearteam"],.ro [data-act="delteam"],.ro [data-act="newteam"],.ro [data-act="jobs"],.ro .grip{display:none!important}
.ro .crown{pointer-events:none}
.ro .crown:not(.on){visibility:hidden}
.ro .mem{cursor:default}
.ro .empty{pointer-events:none;border-style:dotted}
.ro .tname,.ro .pname{pointer-events:none}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;z-index:900;max-width:90vw;text-align:center;font-weight:500}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;max-height:none}
  .roster-list{max-height:290px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script src="config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script async src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<header class="top">
  <div class="brand">
    <div class="logo" aria-hidden="true">⚔️</div>
    <div>
      <h1>จัดทีมปาร์ตี้</h1>
      <p>Ragnarok: The New World · 1 ปาร์ตี้ 5 คน · 1 ทีมสูงสุด 8 ปาร์ตี้</p>
    </div>
  </div>
  <div class="top-actions"><div class="who" id="who"></div>
    <button class="btn" data-act="jobs">จัดการอาชีพ</button>
    <button class="btn" data-act="data">ส่งออก/นำเข้า</button>
    <button class="btn" data-act="theme" aria-label="สลับโหมดสว่าง/มืด">สลับธีม</button>
  </div>
</header>

<div class="app">
  <aside class="side">
    <div class="side-head">
      <h2>รายชื่อสมาชิก <span id="rcount"></span></h2>
      <div class="rstat" id="rstat"></div>
      <div class="addform">
        <input type="text" id="nm" placeholder="ชื่อในเกม" maxlength="24" autocomplete="off" aria-label="ชื่อในเกม">
        <select id="jb" aria-label="อาชีพ"></select>
        <button class="btn primary" data-act="addmem">เพิ่มสมาชิก</button>
      </div>
      <div class="row">
        <button class="btn sm" data-act="bulk">เพิ่มหลายคนพร้อมกัน</button>
        <button class="btn sm" data-act="check">ตรวจสอบตำแหน่งสมาชิก</button>
      </div>
      <input type="search" id="q" placeholder="ค้นหาชื่อหรืออาชีพ" aria-label="ค้นหา">
      <select id="rf" aria-label="กรองตามตำแหน่ง"></select>
      <label class="chk"><input type="checkbox" id="hide"> ซ่อนคนที่อยู่ในทีมนี้แล้ว</label>
    </div>
    <div class="roster-list" id="roster" data-drop="roster"></div>
    <div class="side-foot"><span class="adm-only">ลากชื่อไปวางในช่องปาร์ตี้หรือสำรอง · ลากกลับมาที่นี่เพื่อนำออกจากทีม</span><span class="ro-only">โหมดดูอย่างเดียว · เฉพาะผู้ดูแลแก้ไขได้</span></div>
  </aside>

  <main id="main"></main>
</div>

<div id="gate" class="overlay" style="z-index:700"><div class="dlg"><h3>กำลังเชื่อมต่อฐานข้อมูล…</h3><div class="dlg-body"><p class="help">กำลังโหลดข้อมูลทีม</p></div></div></div>
<div id="modal" class="overlay" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ---------- constants ---------- */
const PS = 5, NP = 8, MAXRES = 10;
const SIZES = [5,10,15,20,25,30,35,40];
const KEY = 'ro-tnw-party-v1', THEME_KEY = 'ro-tnw-theme';
const ROLES = {
  tank:{l:'แทงค์',c:'var(--r-tank)'},
  dps:{l:'ดาเมจ',c:'var(--r-dps)'},
  heal:{l:'ฮีลเลอร์',c:'var(--r-heal)'},
  sup:{l:'ซัพพอร์ต',c:'var(--r-sup)'},
  other:{l:'อื่นๆ',c:'var(--muted)'}
};
const ROLE_ORDER = ['tank','dps','heal','sup','other'];
const DEFAULT_JOBS = [
  ['Knight','dps'],['Crusader','tank'],['Wizard','dps'],['Sage','sup'],['Hunter','dps'],['Bard','sup'],['Dancer','sup'],
  ['Priest','heal'],['Monk','dps'],['Assassin','dps'],['Rogue','dps'],['Blacksmith','dps'],['Alchemist','sup'],
  ['Rebel','dps'],['คานอส','other']
];
const JOBS_VERSION = 2;
// แปลงอาชีพเก่า (รุ่นก่อนหน้า) เป็นอาชีพใหม่ตอนอัปเดต
const JM = {'Royal Guard':'Crusader','Rune Knight':'Knight','Arch Bishop':'Priest','Warlock':'Wizard','Ranger':'Hunter','Minstrel':'Bard','Guillotine Cross':'Assassin','Sorcerer':'Sage','Sura':'Monk','Shadow Chaser':'Rogue','Genetic':'Alchemist','Wanderer':'Dancer','Mechanic':'Blacksmith'};
const ACT_COLORS = ['#e2703a','#22a6c4','#8b6cf0','#e0509a','#3fae6a','#d9a026','#5b8def'];
const DEFAULT_ACTS = [
  {name:'Guild League',icon:'⚔️'},
  {name:'Polarity',icon:'🌀'},
  {name:'ชิงปราสาท',icon:'🏰'}
];

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-3);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const newParty = i => ({name:'ปาร์ตี้ '+(i+1), slots:Array(PS).fill(null)});
const newTeam = (name, activity) => ({id:uid(), name, activity, size:PS*NP, parties:Array.from({length:NP},(_,i)=>newParty(i)), reserves:[]});

/* ---------- state ---------- */
let state = blankState();
let canEdit = false;
let ui = {q:'', hide:false, filter:'all'};
let byId = {};
let plc = {};   // memberId -> where this member is placed (all teams)

function seed(){
  const jobs = DEFAULT_JOBS.map(([name,role])=>({name,role}));
  const raw = [
    ['Aomsin','Royal Guard'],['Bank','Rune Knight'],['Cream','Arch Bishop'],['Dew','Warlock'],['Earth','Ranger'],
    ['Fern','Minstrel'],['Gun','Guillotine Cross'],['Honey','Arch Bishop'],['Ice','Sorcerer'],['Jazz','Sura'],
    ['Kong','Royal Guard'],['Lalita','Shadow Chaser'],['Mook','Genetic'],['Namtan','Wanderer'],['Oat','Mechanic'],['Pang','Warlock']
  ];
  const members = raw.map(([name,job])=>({id:uid(),name,job:JM[job]||job}));
  const a = newTeam('ทีม A','Guild League');
  const b = newTeam('ทีม B','ชิงปราสาท');
  [0,1,2,3,4].forEach(i=>a.parties[0].slots[i]=members[i].id);
  [5,6,7].forEach((m,i)=>a.parties[1].slots[i]=members[m].id);
  a.reserves=[members[15].id];
  return {members,jobs,jv:JOBS_VERSION,activities:DEFAULT_ACTS.map(x=>({...x})),teams:[a,b],active:a.id};
}
function sanitize(s){
  const freshJobs = DEFAULT_JOBS.map(([name,role])=>({name,role}));
  if(s.jv !== JOBS_VERSION){
    s.jobs = freshJobs; s.jv = JOBS_VERSION;
    s.members.forEach(m=>{ if(JM[m.job]) m.job = JM[m.job]; });
  } else s.jobs = (Array.isArray(s.jobs)&&s.jobs.length) ? s.jobs : freshJobs;
  s.activities = (Array.isArray(s.activities)&&s.activities.length) ? s.activities : DEFAULT_ACTS.map(x=>({...x}));
  const ids = new Set(s.members.map(m=>m.id));
  s.teams.forEach(t=>{
    if(!t.id) t.id = uid();
    t.size = (Number.isInteger(t.size) && t.size>=PS && t.size<=PS*NP && t.size%PS===0) ? t.size : PS*NP;
    t.parties = (t.parties||[]).slice(0,NP);
    while(t.parties.length<NP) t.parties.push(newParty(t.parties.length));
    const seen = new Set();
    t.parties.forEach(pt=>{
      pt.slots = (pt.slots||[]).slice(0,PS).map(id=>(ids.has(id)&&!seen.has(id)&&seen.add(id))?id:null);
      while(pt.slots.length<PS) pt.slots.push(null);
    });
    t.reserves = (t.reserves||[]).filter(id=>ids.has(id)&&!seen.has(id)&&seen.add(id)).slice(0,MAXRES);
    if(!s.activities.some(a=>a.name===t.activity)) s.activities.push({name:t.activity||'อื่นๆ',icon:'⭐'});
  });
  if(!s.teams.find(t=>t.id===s.active)) s.active = s.teams[0].id;
  return s;
}
function load(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY));
    if(s && Array.isArray(s.members) && Array.isArray(s.teams) && s.teams.length) return sanitize(s);
  }catch(e){}
  return seed();
}
function save(){
  if(!canEdit || !cloud.ready) return;
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}   // local copy (primary in single-device mode, backup otherwise)
  if(cloud.mode!=='firebase') return;
  clearTimeout(cloud.saveTimer);
  cloud.saveTimer = setTimeout(flush, 350);
  setSync('กำลังบันทึก…');
}

/* ---------- lookups ---------- */
const team = () => state.teams.find(t=>t.id===state.active) || state.teams[0];
const roleOf = job => (state.jobs.find(j=>j.name===job)||{}).role || 'other';
const actOf = name => state.activities.find(a=>a.name===name) || {name,icon:'⭐'};
const actColor = name => { const i = state.activities.findIndex(a=>a.name===name); return ACT_COLORS[(i<0?0:i)%ACT_COLORS.length]; };
const ROLE_HEX = {tank:'#3b82f6', dps:'#e5484d', heal:'#2fa866', sup:'#9b5de5', other:'#8a94a6'};
function colorOf(job){
  const j = state.jobs.find(x=>x.name===job);
  if(j && typeof j.color==='string' && /^#[0-9a-f]{6}$/i.test(j.color)) return j.color;
  return ROLES[roleOf(job)].c;
}
function jobColorValue(j){
  return (j.color && /^#[0-9a-f]{6}$/i.test(j.color)) ? j.color : (ROLE_HEX[j.role] || ROLE_HEX.other);
}
function nameKey(n){ return String(n==null?'':n).normalize('NFC').trim().replace(/\s+/g,' ').toLowerCase(); }
function nameTaken(name, exceptId){
  const k = nameKey(name);
  return state.members.some(m=>m.id!==exceptId && nameKey(m.name)===k);
}
function iconOf(job){
  const j = state.jobs.find(x=>x.name===job);
  return (j && typeof j.icon==='string' && /^data:image\//.test(j.icon)) ? j.icon : '';
}
function abbr(job){
  const w = String(job).trim().split(/\s+/);
  if(w.length>1) return (w[0][0]+w[1][0]).toUpperCase();
  const s = w[0]||'?';
  return /^[\x00-\x7f]+$/.test(s) ? s[0].toUpperCase()+(s[1]||'').toLowerCase() : s.slice(0,2);
}
function teamIds(t){
  const a = [];
  t.parties.forEach(p=>p.slots.forEach(id=>id&&a.push(id)));
  return a.concat(t.reserves);
}
function locate(t, mid){
  for(let p=0;p<t.parties.length;p++){
    const i = t.parties[p].slots.indexOf(mid);
    if(i>=0) return {k:'slot',p,i};
  }
  const r = t.reserves.indexOf(mid);
  return r>=0 ? {k:'reserve',i:r} : null;
}
function clearLoc(t, loc){
  if(loc.k==='slot') t.parties[loc.p].slots[loc.i] = null;
  else t.reserves.splice(loc.i,1);
}

/* ---------- toast & modal ---------- */
let toastTimer;
function toast(msg){
  const el = $('#toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>el.classList.remove('show'), 2400);
}
function modal({title, html='', buttons=[{label:'ปิด'}], onOpen}){
  const ov = $('#modal');
  ov.innerHTML = '<div class="dlg" role="dialog" aria-modal="true"><h3></h3><div class="dlg-body"></div><div class="dlg-foot"></div></div>';
  ov.querySelector('h3').textContent = title;
  ov.querySelector('.dlg-body').innerHTML = html;
  const foot = ov.querySelector('.dlg-foot');
  buttons.forEach(b=>{
    const el = document.createElement('button');
    el.className = 'btn ' + (b.cls||'');
    el.textContent = b.label;
    el.addEventListener('click', ()=>{
      if(b.fn && b.fn()===false) return;
      closeModal();
    });
    foot.appendChild(el);
  });
  ov.hidden = false;
  if(onOpen) onOpen(ov);
}
function closeModal(){ const ov=$('#modal'); ov.hidden=true; ov.innerHTML=''; }
$('#modal').addEventListener('mousedown', e=>{ if(e.target.id==='modal') closeModal(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && !$('#modal').hidden) closeModal(); });
function confirmBox(msg, okLabel, fn){
  modal({title:'ยืนยันการทำรายการ', html:'<p class="help" style="font-size:14px;color:var(--ink)">'+esc(msg)+'</p>',
    buttons:[{label:'ยกเลิก'},{label:okLabel,cls:'danger',fn:()=>{fn();}}]});
}

/* ---------- job options ---------- */
function jobOptions(sel){
  let h = '';
  ROLE_ORDER.forEach(r=>{
    const js = state.jobs.filter(j=>(ROLES[j.role]?j.role:'other')===r);
    if(!js.length) return;
    h += '<optgroup label="'+esc(ROLES[r].l)+'">' + js.map(j=>'<option value="'+esc(j.name)+'"'+(j.name===sel?' selected':'')+'>'+esc(j.name)+'</option>').join('') + '</optgroup>';
  });
  if(sel && !state.jobs.some(j=>j.name===sel)) h += '<option value="'+esc(sel)+'" selected>'+esc(sel)+'</option>';
  return h;
}

/* ---------- rendering ---------- */
/* ---------- where is each member placed? (all teams / activities) ---------- */
function placements(){
  const map = {};
  state.teams.forEach(t=>{
    t.parties.slice(0, t.size/PS).forEach((pt,p)=>pt.slots.forEach((id,i)=>{
      if(id) (map[id] = map[id] || []).push({tid:t.id, team:t.name, act:t.activity, kind:'slot', p, party:pt.name, i});
    }));
    t.reserves.forEach(id=>{ (map[id] = map[id] || []).push({tid:t.id, team:t.name, act:t.activity, kind:'reserve'}); });
  });
  return map;
}
// activities in which the member sits in more than one team = probably entered twice
function conflictsOf(list){
  const by = {};
  list.forEach(x=>{ (by[x.act] = by[x.act] || new Set()).add(x.tid); });
  return Object.keys(by).filter(a=>by[a].size>1);
}
function passFilter(m){
  const L = plc[m.id] || [], f = ui.filter || 'all';
  if(f==='all') return true;
  if(f==='none') return L.length===0;
  if(f==='placed') return L.length>0;
  if(f==='multi') return new Set(L.map(x=>x.tid)).size>1;
  if(f==='dup') return conflictsOf(L).length>0;
  if(f.indexOf('free:')===0){ const a = f.slice(5); return !L.some(x=>x.act===a); }
  return true;
}
function filterOptions(){
  return [['all','ทั้งหมด'],['none','ยังไม่ลงทีมไหนเลย'],['placed','ลงทีมแล้ว (อย่างน้อย 1 ที่)'],['multi','อยู่หลายทีม'],['dup','⚠ ซ้ำในกิจกรรมเดียวกัน']]
    .concat(state.activities.map(a=>['free:'+a.name, 'ยังไม่ได้ลง '+a.name]));
}
function locBtn(x, bad, long){
  const label = (long ? '' : actOf(x.act).icon+' ')+x.team+' · '+(x.kind==='slot' ? x.party : 'สำรอง');
  return '<button class="loc'+(bad?' bad':'')+'" data-act="goto" data-tid="'+esc(x.tid)+'" data-p="'+(x.kind==='slot'?x.p:'')+'" title="'
    + esc(x.act+' · '+x.team+' · '+(x.kind==='slot'?x.party:'สำรอง')+(bad?' (ซ้ำกับทีมอื่นในกิจกรรมเดียวกัน)':'')+' · กดเพื่อไปที่นั่น')+'">'+esc(label)+'</button>';
}
function locTags(id, max){
  const L = plc[id] || [];
  if(!L.length) return '<span class="locs"><span class="loc none">ยังไม่ลงทีมไหน</span></span>';
  const bad = new Set(conflictsOf(L)), show = L.slice(0, max||3);
  return '<span class="locs">'+show.map(x=>locBtn(x, bad.has(x.act))).join('')
    + (L.length>show.length ? '<span class="loc more" title="'+esc(L.slice(show.length).map(x=>x.team+' · '+(x.kind==='slot'?x.party:'สำรอง')).join(', '))+'">+'+(L.length-show.length)+'</span>' : '')+'</span>';
}
function dupWarn(id){
  const t = team();
  const o = (plc[id]||[]).filter(x=>x.act===t.activity && x.tid!==t.id);
  if(!o.length) return '';
  return '<span class="tag dup" title="'+esc('อยู่ในทีมอื่นของกิจกรรม '+t.activity+' ด้วย: '+o.map(x=>x.team+' · '+(x.kind==='slot'?x.party:'สำรอง')).join(', '))+'">ซ้ำ</span>';
}
function warnPlaced(mid){
  const t = team(), m = byId[mid]; if(!m) return;
  const o = (placements()[mid]||[]).filter(x=>x.act===t.activity && x.tid!==t.id);
  if(o.length) toast('⚠ '+m.name+' อยู่ที่ '+o.map(x=>x.team).join(', ')+' (กิจกรรม '+t.activity+') แล้ว · ชื่อซ้ำกัน');
}
function flashParty(p){
  if(p===''||p==null) return;
  const el = document.querySelector('.party[data-p="'+p+'"]'); if(!el) return;
  el.classList.add('flash');
  try{ el.scrollIntoView({block:'center', behavior:'smooth'}); }catch(e){}
  setTimeout(()=>el.classList.remove('flash'), 2600);
}
function checkModal(f0){
  const cur = {f:f0||'all', q:''};
  const total = state.members.length;
  const cnt = {none:0, placed:0, multi:0, dup:0};
  state.members.forEach(m=>{
    const L = plc[m.id]||[];
    if(!L.length) cnt.none++; else cnt.placed++;
    if(new Set(L.map(x=>x.tid)).size>1) cnt.multi++;
    if(conflictsOf(L).length) cnt.dup++;
  });
  const chipBtn = (f,label,n,warn)=>'<button class="rc'+(warn&&n?' warnbtn':'')+'" data-ckf="'+f+'" style="font:inherit;font-size:12.5px;cursor:pointer">'+label+' <b>'+n+'</b></button>';
  const sum = '<div class="rolechips">'+chipBtn('all','ทั้งหมด',total)+chipBtn('placed','ลงทีมแล้ว',cnt.placed)+chipBtn('none','ยังไม่ลงทีมไหน',cnt.none)+chipBtn('multi','อยู่หลายทีม',cnt.multi)+chipBtn('dup','⚠ ซ้ำในกิจกรรมเดียวกัน',cnt.dup,true)+'</div>';
  const row = m=>{
    const L = plc[m.id]||[], bad = new Set(conflictsOf(L)), by = {};
    L.forEach(x=>{ (by[x.act] = by[x.act] || []).push(x); });
    const groups = Object.keys(by).map(a=>'<div class="ckg"><b>'+esc(actOf(a).icon+' '+a)+'</b>'+by[a].map(x=>locBtn(x, bad.has(a), true)).join('')+(bad.has(a)?'<span class="tag dup">ซ้ำ</span>':'')+'</div>').join('');
    return '<div class="ckrow'+(bad.size?' bad':'')+'"><div class="ckn"><b>'+esc(m.name)+'</b><small>'+esc(m.job)+'</small></div><div class="ckl">'+(groups || '<span class="loc none">ยังไม่ลงทีมไหน</span>')+'</div></div>';
  };
  modal({title:'ตรวจสอบตำแหน่งสมาชิก',
    html:sum+'<p class="help">ซ้ำ = ชื่อเดียวกันอยู่หลายทีมที่เป็นกิจกรรมเดียวกัน (อยู่คนละกิจกรรมไม่นับว่าซ้ำ) กดชื่อทีมเพื่อไปดูที่ตำแหน่งนั้น</p>'
      +'<div class="row"><input type="search" id="ck-q" placeholder="ค้นหาชื่อหรืออาชีพ"><select id="ck-f" style="width:auto;min-width:190px"></select></div>'
      +'<div class="pick-list" id="ck-list" style="max-height:52vh"></div>',
    buttons:[{label:'ปิด'}],
    onOpen:(ov)=>{
      ov.querySelector('.dlg').style.width = 'min(860px,100%)';
      const sel = $('#ck-f');
      sel.innerHTML = filterOptions().map(([v,l])=>'<option value="'+esc(v)+'">'+esc(l)+'</option>').join('');
      const draw = ()=>{
        sel.value = cur.f; if(sel.value!==cur.f){ cur.f = 'all'; sel.value = 'all'; }
        const q = cur.q.trim().toLowerCase(), keep = ui.filter;
        ui.filter = cur.f;
        let ms = state.members.filter(m=>passFilter(m) && (!q || m.name.toLowerCase().includes(q) || m.job.toLowerCase().includes(q)));
        ui.filter = keep;
        ms = ms.slice().sort((a,b)=>conflictsOf(plc[b.id]||[]).length - conflictsOf(plc[a.id]||[]).length);
        $('#ck-list').innerHTML = ms.length ? ms.map(row).join('') : '<div class="empty-note">ไม่พบสมาชิกที่ตรงกับตัวกรอง</div>';
      };
      sel.onchange = ()=>{ cur.f = sel.value; draw(); };
      $('#ck-q').oninput = e=>{ cur.q = e.target.value; draw(); };
      ov.querySelectorAll('[data-ckf]').forEach(b=>{ b.onclick = ()=>{ cur.f = b.dataset.ckf; draw(); }; });
      draw();
    }});
}

function chip(m, kind, extra, sub){
  const r = ROLES[roleOf(m.job)];
  return '<div class="mem" data-drag="'+kind+'" data-mid="'+m.id+'" style="--rc:'+colorOf(m.job)+'" title="'+esc(m.name)+' · '+esc(m.job)+' · '+r.l+'">'
    + '<span class="grip" aria-hidden="true">⋮⋮</span>'
    + (iconOf(m.job) ? '<span class="badge has-img"><img src="'+esc(iconOf(m.job))+'" alt="" draggable="false"></span>' : '<span class="badge">'+esc(abbr(m.job))+'</span>')
    + '<span class="mt"><b>'+esc(m.name)+'</b><small>'+esc(m.job)+'</small>'+(sub||'')+'</span>'
    + (extra||'') + '</div>';
}

function renderTabs(){
  const tabs = state.teams.map(t=>{
    const n = t.parties.reduce((a,p)=>a+p.slots.filter(Boolean).length,0);
    return '<button class="tab'+(t.id===state.active?' on':'')+'" data-act="tab" data-id="'+t.id+'" style="--tc:'+actColor(t.activity)+'">'
      + '<span>'+esc(actOf(t.activity).icon)+'</span><span>'+esc(t.name)+'</span><small>'+n+'/'+t.size+'</small></button>';
  }).join('');
  return '<nav class="tabs" aria-label="ทีม">'+tabs+'<button class="tab add" data-act="newteam">＋ ทีมใหม่</button></nav>';
}

function partyHtml(pt, p, byId){
  const ms = pt.slots.map(id=>id?byId[id]:null);
  const head = (pt.head && pt.slots.includes(pt.head) && byId[pt.head]) ? pt.head : null;
  const n = ms.filter(Boolean).length;
  const dots = ms.filter(Boolean).map(m=>'<i style="background:'+colorOf(m.job)+'"></i>').join('');
  const slots = pt.slots.map((id,i)=>{
    const m = ms[i];
    const inner = m
      ? chip(m,'slot',dupWarn(m.id)+'<button class="icon x" data-act="rmslot" data-p="'+p+'" data-i="'+i+'" title="นำออกจากปาร์ตี้" aria-label="นำออก">✕</button>')
      : (canEdit ? '<button class="empty" data-act="pick" data-p="'+p+'" data-i="'+i+'">＋ เลือกสมาชิก</button>' : '<div class="empty" style="display:grid;place-items:center">ว่าง</div>');
    return '<div class="slot'+(m&&m.id===head?' is-head':'')+'" data-drop="slot" data-p="'+p+'" data-i="'+i+'">'
      + (m ? '<button class="crown'+(m.id===head?' on':'')+'" data-act="head" data-p="'+p+'" data-i="'+i+'" title="'+(m.id===head?'เป็นหัวหน้าปาร์ตี้ (กดเพื่อยกเลิก)':'ตั้งเป็นหัวหน้าปาร์ตี้ (คนตั้ง)')+'" aria-label="ตั้งเป็นหัวหน้าปาร์ตี้">👑</button>' : '<span class="no" style="width:22px">'+(i+1)+'</span>')
      + inner + '</div>';
  }).join('');
  return '<section class="party'+(n===PS?' full':'')+'" data-drop="party" data-p="'+p+'">'
    + '<header><input class="pname" data-act="pname" data-p="'+p+'" value="'+esc(pt.name)+'" maxlength="24" aria-label="ชื่อปาร์ตี้">'
    + '<span class="dots">'+dots+'</span><span class="cnt">'+n+'/'+PS+'</span></header>'
    + '<div class="phead'+(head?'':' none')+'">'+(head?'👑 หัวหน้าปาร์ตี้ (คนตั้ง): <b>'+esc(byId[head].name)+'</b>':'ยังไม่ได้เลือกคนตั้งปาร์ตี้ · กด 👑 หน้าชื่อสมาชิก')+'</div>'
    + '<div class="slots">'+slots+'</div></section>';
}

function renderMain(){
  const t = team();
  const act = actOf(t.activity);
  const placed = [];
  t.parties.forEach(p=>p.slots.forEach(id=>id&&byId[id]&&placed.push(byId[id])));
  const total = t.size;
  const rc = {};
  placed.forEach(m=>{ const r=roleOf(m.job); rc[r]=(rc[r]||0)+1; });

/* ---------- placing members ---------- */
function drop(mid, target){
  const t = team();
  const cur = locate(t, mid);

  if(target.type==='roster'){
    if(cur){ clearLoc(t,cur); toast('นำ '+byId[mid].name+' ออกจากทีมแล้ว'); }
    return true;
  }
  if(target.type==='reserve'){
    if(cur && cur.k==='reserve') return false;
    if(t.reserves.length>=MAXRES){ toast('รายชื่อสำรองเต็มแล้ว (สูงสุด '+MAXRES+' คน)'); return false; }
    if(cur) clearLoc(t,cur);
    t.reserves.push(mid);
    return true;
  }
  if(target.type==='party'){
    const pt = t.parties[target.p];
    const i = pt.slots.indexOf(null);
    if(i<0){ toast(pt.name+' เต็มแล้ว · วางทับช่องที่ต้องการเพื่อสลับตำแหน่ง'); return false; }
    target = {type:'slot',p:target.p,i};
  }
  // slot
  const slots = t.parties[target.p].slots;
  const occ = slots[target.i];
  if(occ===mid) return false;
  if(cur){
    if(occ){
      if(cur.k==='slot') t.parties[cur.p].slots[cur.i] = occ; else t.reserves[cur.i] = occ;
    } else clearLoc(t,cur);
  } else if(occ){
    if(t.reserves.length<MAXRES){ t.reserves.push(occ); toast(byId[occ].name+' ถูกย้ายไปรายชื่อสำรอง'); }
    else toast(byId[occ].name+' ถูกนำออกจากทีม');
  }
  slots[target.i] = mid;
  return true;
}

/* ---------- drag & drop (pointer events: mouse + touch) ---------- */
let drag = null;
function targetAt(x,y){
  const el = document.elementFromPoint(x,y);
  const d = el && el.closest('[data-drop]');
  if(!d) return null;
  const k = d.dataset.drop;
  if(k==='slot') return {type:'slot',p:+d.dataset.p,i:+d.dataset.i,el:d};
  if(k==='party') return {type:'party',p:+d.dataset.p,el:d};
  return {type:k,el:d};
}
function clearOver(){ document.querySelectorAll('.over').forEach(e=>e.classList.remove('over')); }
function endDrag(){
  if(!drag) return;
  clearInterval(drag.timer);
  if(drag.ghost) drag.ghost.remove();
  if(drag.srcEl) drag.srcEl.classList.remove('ghosted');
  document.body.classList.remove('is-dragging');
  clearOver();
  drag = null;
}
document.addEventListener('pointerdown', e=>{
  if(drag) return;
  if(!canEdit) return;
  const el = e.target.closest('[data-drag]');
  if(!el || e.target.closest('button,input,select,textarea')) return;
  if(e.pointerType==='mouse' && e.button!==0) return;
  if(e.pointerType!=='mouse' && !e.target.closest('.grip')) return;
  drag = {mid:el.dataset.mid, src:el.dataset.drag, srcEl:el, x0:e.clientX, y0:e.clientY, x:e.clientX, y:e.clientY, active:false, ghost:null, timer:null};
});
document.addEventListener('pointermove', e=>{
  if(!drag) return;
  drag.x = e.clientX; drag.y = e.clientY;
  if(!drag.active){
    if(Math.hypot(e.clientX-drag.x0, e.clientY-drag.y0) < 6) return;
    drag.active = true;
    const r = drag.srcEl.getBoundingClientRect();
    drag.dx = drag.x0 - r.left; drag.dy = drag.y0 - r.top;
    const g = drag.srcEl.cloneNode(true);
    g.classList.add('drag-ghost'); g.classList.remove('ghosted');
    g.style.width = r.width+'px';
    document.body.appendChild(g);
    drag.ghost = g;
    drag.srcEl.classList.add('ghosted');
    document.body.classList.add('is-dragging');
    drag.timer = setInterval(()=>{
      if(!drag) return;
      if(drag.y < 80) window.scrollBy(0,-16);
      else if(drag.y > window.innerHeight-80) window.scrollBy(0,16);
    }, 16);
  }
  e.preventDefault();
  drag.ghost.style.left = (e.clientX-drag.dx)+'px';
  drag.ghost.style.top = (e.clientY-drag.dy)+'px';
  clearOver();
  const tg = targetAt(e.clientX, e.clientY);
  if(tg && !(tg.type==='roster' && drag.src==='roster')) tg.el.classList.add('over');
}, {passive:false});
document.addEventListener('pointerup', e=>{
  if(!drag) return;
  if(drag.active){
    const tg = targetAt(e.clientX, e.clientY);
    const mid = drag.mid, src = drag.src;
    endDrag();
    if(tg && !(tg.type==='roster' && src==='roster')){
      if(drop(mid, tg)) warnPlaced(mid);
      render();
    }
  } else endDrag();
});
document.addEventListener('pointercancel', endDrag);
document.addEventListener('dragstart', e=>{ if(e.target.closest && e.target.closest('.mem')) e.preventDefault(); });

      const lines = $('#bk').value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);

      const dup = [];
      lines.forEach(line=>{
        let name, job;
        const m = line.split(/[,\t|]/);
        if(m.length>=2){ name = m[0].trim(); job = m.slice(1).join(' ').trim(); }
        else {
          const hit = state.jobs.find(j=>line.toLowerCase().endsWith(j.name.toLowerCase()));

function resizeTeam(t, size){
  const keep = size/PS, orphans = [];
  t.parties.forEach((pt,p)=>{ if(p>=keep) pt.slots.forEach((id,i)=>{ if(id){ orphans.push(id); pt.slots[i] = null; } }); });
  t.size = size;
  let toReserve = 0, removed = 0;
  orphans.forEach(id=>{
    let placed = false;
    for(let p=0;p<keep && !placed;p++){

function setRowIcon(row, url){
  row.dataset.icon = url || '';
  const lb = row.querySelector('.jic');
  const old = lb.querySelector('img'); if(old) old.remove();
  if(lb.firstChild && lb.firstChild.nodeType===3) lb.firstChild.remove();
  if(url){ const im = document.createElement('img'); im.src = url; im.alt = ''; lb.prepend(im); }
  else lb.prepend(document.createTextNode('＋'));

function fileToIcon(file){
  return new Promise((resolve,reject)=>{
    const fr = new FileReader();
    fr.onerror = reject;
    fr.onload = ()=>{
      const img = new Image();
      img.onerror = reject;
      img.onload = ()=>{
        const S = 72, c = document.createElement('canvas');
        c.width = c.height = S;
        const k = Math.min(S/img.width, S/img.height), w = img.width*k, h = img.height*k;
        c.getContext('2d').drawImage(img, (S-w)/2, (S-h)/2, w, h);
        resolve(c.toDataURL('image/png'));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

const IMG_FONT = '"Noto Sans Thai","Sarabun",system-ui,-apple-system,"Segoe UI",sans-serif';
const IMG_HEAD = '"Prompt","Noto Sans Thai",system-ui,sans-serif';
function hexOf(job){
  const j = state.jobs.find(x=>x.name===job);
  if(j && typeof j.color==='string' && /^#[0-9a-f]{6}$/i.test(j.color)) return j.color;
  return ROLE_HEX[roleOf(job)] || ROLE_HEX.other;
}
function loadImg(src){
  return new Promise(res=>{ const i = new Image(); i.onload = ()=>res(i); i.onerror = ()=>res(null); i.src = src; });
}
function rr(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}
function fitText(ctx, text, maxW){
  text = String(text);
  if(ctx.measureText(text).width <= maxW) return text;
  let s = text;
  while(s.length > 1 && ctx.measureText(s+'…').width > maxW) s = s.slice(0, -1);
  return s+'…';
}
async function renderTeamImage(t, o){
  try{
    await Promise.all([
      document.fonts.load('600 18px "Noto Sans Thai"', 'ปาร์ตี้ทีม'),
      document.fonts.load('400 14px "Noto Sans Thai"', 'ปาร์ตี้ทีม'),
      document.fonts.load('600 18px "Prompt"', 'ปาร์ตี้ทีม')
    ]);
  }catch(e){}
  const P = o.dark
    ? {bg:'#10151f', surf:'#192130', line:'#2f3b52', ink:'#e8edf6', muted:'#96a3b8', goldbg:'#3b3322'}
    : {bg:'#e8ecf2', surf:'#ffffff', line:'#d3dae5', ink:'#18212f', muted:'#667388', goldbg:'#fbf1d6'};
  const GOLD = '#d9a026', GREEN = '#2fa866';
  const act = actOf(t.activity), actCol = actColor(t.activity);
  const mem = {}; state.members.forEach(m=>{ mem[m.id] = m; });

  const nShow = idxs.length;

  const rowsP = Math.ceil(nShow / cols);
  const SC = o.scale || 2, PAD = 28, GAP = 16, CW = 300, RH = 50, RG = 8, HEADH = 46, HLH = 30, TH = 104;
  const cardH = HEADH + HLH + PS*(RH+RG) + 4;
  const gridW = cols*CW + (cols-1)*GAP;
  const tw = Math.max(gridW, 560), W = tw + PAD*2;
  const gx = Math.round((W - gridW) / 2);
  const resList = o.reserve ? t.reserves.filter(id=>mem[id]) : [];
  const showRes = resList.length > 0;
  const resRows = Math.ceil(resList.length / cols);
  const resH = 44 + resRows*(RH+RG) + 4;
  const H = PAD + TH + rowsP*cardH + (rowsP-1)*GAP + (showRes ? GAP+resH : 0) + (o.footer===false ? 12 : 40);

  // preload job icons
  const icons = {};
  const jobs = new Set();
  idxs.forEach(p=>t.parties[p].slots.forEach(id=>{ if(id && mem[id]) jobs.add(mem[id].job); }));
  resList.forEach(id=>jobs.add(mem[id].job));
  await Promise.all([...jobs].map(async j=>{ const src = iconOf(j); icons[j] = src ? await loadImg(src) : null; }));

  const c = document.createElement('canvas');
  c.width = W*SC; c.height = H*SC;
  const ctx = c.getContext('2d');
  ctx.scale(SC, SC);
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = P.bg; ctx.fillRect(0, 0, W, H);

  // ---- title ----
  const placed = [];
  t.parties.slice(0, nP).forEach(pt=>pt.slots.forEach(id=>{ if(id && mem[id]) placed.push(mem[id]); }));
  const rc = {}; placed.forEach(m=>{ const r = roleOf(m.job); rc[r] = (rc[r]||0)+1; });
  ctx.textAlign = 'left';
  ctx.font = '30px sans-serif'; ctx.fillStyle = P.ink;
  ctx.fillText(act.icon, PAD, PAD+34);
  ctx.font = '600 28px '+IMG_HEAD; ctx.fillStyle = P.ink;
  ctx.fillText(fitText(ctx, t.name, tw-210), PAD+46, PAD+32);
  ctx.font = '500 14px '+IMG_FONT; ctx.fillStyle = P.muted;
  ctx.fillText(t.activity+' · '+(nShow<nP ? 'แสดง '+nShow+' จาก '+nP : nP)+' ปาร์ตี้', PAD+46, PAD+54);
  ctx.textAlign = 'right';
  ctx.font = '13px '+IMG_FONT; ctx.fillStyle = P.muted;
  ctx.fillText('ตัวจริงในทีม', W-PAD, PAD+20);
  ctx.font = '600 24px '+IMG_HEAD; ctx.fillStyle = placed.length===t.size ? GREEN : P.ink;
  ctx.fillText(placed.length+' / '+t.size, W-PAD, PAD+48);
  ctx.textAlign = 'left';
  let cx = PAD; const cy = PAD+68;
  ROLE_ORDER.filter(r=>rc[r]).forEach(r=>{
    const label = ROLES[r].l+' '+rc[r];
    ctx.font = '600 13px '+IMG_FONT;
    const w = ctx.measureText(label).width + 38;
    rr(ctx, cx, cy, w, 28, 14); ctx.fillStyle = P.surf; ctx.fill(); ctx.strokeStyle = P.line; ctx.lineWidth = 1; ctx.stroke();
    ctx.beginPath(); ctx.arc(cx+14, cy+14, 4.5, 0, Math.PI*2); ctx.fillStyle = ROLE_HEX[r]; ctx.fill();

    cx += w + 8;

  // ---- one member row ----
  function drawMember(x, y, w, h, m, isHead){
    rr(ctx, x, y, w, h, 9);

      ctx.fillStyle = P.muted; ctx.font = '13px '+IMG_FONT; ctx.textAlign = 'center';
      ctx.fillText('ว่าง', x+w/2, y+h/2+5); ctx.textAlign = 'left';

    }
    ctx.fillStyle = P.surf; ctx.fill();
    ctx.strokeStyle = isHead ? GOLD : P.line; ctx.lineWidth = isHead ? 2 : 1; ctx.stroke();
    const col = hexOf(m.job);

    const bs = 36, bx = x+16, by = y+(h-bs)/2, im = icons[m.job];
    if(im){ ctx.drawImage(im, bx, by, bs, bs); }
    else {

      ctx.fillStyle = P.ink; ctx.font = '600 13px '+IMG_HEAD; ctx.textAlign = 'center';
      ctx.fillText(abbr(m.job), bx+bs/2, by+bs/2+5); ctx.textAlign = 'left';
    }
    const tx = bx+bs+10, maxw = w-(tx-x)-(isHead ? 32 : 12);
    ctx.fillStyle = P.ink; ctx.font = '600 16px '+IMG_FONT;
    ctx.fillText(fitText(ctx, m.name, maxw), tx, y+23);
    ctx.fillStyle = P.muted; ctx.font = '12px '+IMG_FONT;
    ctx.fillText(fitText(ctx, m.job, maxw), tx, y+40);
    if(isHead){ ctx.font = '16px sans-serif'; ctx.textAlign = 'right'; ctx.fillText('\uD83D\uDC51', x+w-10, y+h/2+6); ctx.textAlign = 'left'; }
  }

  // ---- parties ----
  const top0 = PAD + TH;
  for(let k0=0; k0<nShow; k0++){
    const p = idxs[k0];
    const x = gx + (k0%cols)*(CW+GAP), y = top0 + Math.floor(k0/cols)*(cardH+GAP);
    const pt = t.parties[p], ids = pt.slots;
    const filled = ids.filter(id=>id && mem[id]);
    const n = filled.length;
    const headId = (pt.head && ids.includes(pt.head) && mem[pt.head]) ? pt.head : null;
    rr(ctx, x, y, CW, cardH, 14); ctx.fillStyle = P.surf; ctx.fill(); ctx.strokeStyle = P.line; ctx.lineWidth = 1; ctx.stroke();
    ctx.save(); rr(ctx, x, y, CW, cardH, 14); ctx.clip(); ctx.fillStyle = n===PS ? GREEN : actCol; ctx.fillRect(x, y, CW, 5); ctx.restore();
    // header: name, role dots, count
    ctx.textAlign = 'right'; ctx.font = '600 13px '+IMG_FONT; ctx.fillStyle = n===PS ? GREEN : P.muted;
    const cnt = n+'/'+PS;
    ctx.fillText(cnt, x+CW-16, y+33);
    let dx = x+CW-16-ctx.measureText(cnt).width-12;
    filled.slice().reverse().forEach(id=>{
      ctx.beginPath(); ctx.arc(dx-4, y+28, 4, 0, Math.PI*2); ctx.fillStyle = hexOf(mem[id].job); ctx.fill(); dx -= 11;
    });
    ctx.textAlign = 'left'; ctx.fillStyle = P.ink; ctx.font = '600 17px '+IMG_HEAD;
    ctx.fillText(fitText(ctx, pt.name, 150), x+16, y+34);
    if(headId){
      rr(ctx, x+12, y+HEADH, CW-24, 24, 8); ctx.fillStyle = P.goldbg; ctx.fill();
      ctx.fillStyle = P.ink; ctx.font = '13px '+IMG_FONT;
      ctx.fillText(fitText(ctx, '\uD83D\uDC51 หัวหน้า: '+mem[headId].name, CW-44), x+22, y+HEADH+17);
    }
    for(let i=0; i<PS; i++){
      const id = ids[i], m = id && mem[id] ? mem[id] : null;
      drawMember(x+12, y+HEADH+HLH+i*(RH+RG), CW-24, RH, m, !!m && m.id===headId);
    }
  }

  // ---- reserve ----
  if(showRes){
    const y = top0 + rowsP*cardH + (rowsP-1)*GAP + GAP;
    rr(ctx, gx, y, gridW, resH, 14); ctx.fillStyle = P.surf; ctx.fill(); ctx.strokeStyle = P.line; ctx.lineWidth = 1; ctx.stroke();
    ctx.save(); rr(ctx, gx, y, gridW, resH, 14); ctx.clip(); ctx.fillStyle = '#8a94a6'; ctx.fillRect(gx, y, 5, resH); ctx.restore();
    ctx.fillStyle = P.ink; ctx.font = '600 16px '+IMG_HEAD; ctx.textAlign = 'left';
    ctx.fillText('รายชื่อสำรอง ('+resList.length+')', gx+18, y+29);

  // ---- footer ----

}
// stack several teams into one tall image (falls back to 1x if the canvas would get too big)
async function renderTeamsImage(teams, o){

function roleKey(v){
  v = String(v||'').trim().toLowerCase();
  for(const k in ROLES){ if(k===v || ROLES[k].l===v) return k; }
  return 'other';
}
function stamp(){
  const d = new Date(), p = n=>String(n).padStart(2,'0');
  return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes());
}
async function saveFile(filename, data){
  try{
    const type = /\.xlsx$/i.test(filename) ? 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' : 'application/json';
    const blob = data instanceof Blob ? data : new Blob([data], {type});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 3000);
    toast('ดาวน์โหลดไฟล์แล้ว');
  }catch(err){ toast('ดาวน์โหลดไม่สำเร็จ · ใช้ปุ่มคัดลอก JSON แทน'); }
}
function exportJSON(){
  return JSON.stringify({app:'ro-tnw-party-planner', version:1, exportedAt:new Date().toISOString(), data:state}, null, 2);
}
function buildWorkbook(){
  const X = window.XLSX, wb = X.utils.book_new();
  const sheet = (name, head, rows, widths)=>{
    const ws = X.utils.aoa_to_sheet([head].concat(rows));
    ws['!cols'] = widths.map(w=>({wch:w}));
    X.utils.book_append_sheet(wb, ws, name);
  };
  const mem = {}; state.members.forEach(m=>mem[m.id]=m);
  sheet('สมาชิก', ['ชื่อ','อาชีพ'], state.members.map(m=>[m.name,m.job]), [24,20]);
  sheet('ทีม', ['ชื่อทีม','กิจกรรม','จำนวนคน'], state.teams.map(t=>[t.name,t.activity,t.size]), [24,22,10]);
  const rows = [];
  state.teams.forEach(t=>{
    t.parties.forEach((pt,p)=>pt.slots.forEach((id,i)=>{
      const m = id && mem[id]; if(!m) return;
      rows.push([t.name, p+1, pt.name, i+1, m.name, m.job, pt.head===id?'✓':'']);
    }));
    t.reserves.forEach((id,i)=>{ const m = mem[id]; if(m) rows.push([t.name,'สำรอง','',i+1,m.name,m.job,'']); });
  });
  sheet('การจัดทีม', ['ชื่อทีม','ปาร์ตี้','ชื่อปาร์ตี้','ช่อง','ชื่อสมาชิก','อาชีพ','หัวหน้า'], rows, [20,10,18,8,24,20,10]);
  sheet('อาชีพ', ['อาชีพ','บทบาท','สี'], state.jobs.map(j=>[j.name,(ROLES[j.role]||ROLES.other).l,j.color||'']), [22,14,10]);
  sheet('กิจกรรม', ['กิจกรรม','ไอคอน'], state.activities.map(a=>[a.name,a.icon]), [24,8]);
  return X.write(wb, {bookType:'xlsx', type:'array'});
}
function normalizeJSON(o){
  const s = (o && o.data && Array.isArray(o.data.members)) ? o.data : o;
  if(!s || !Array.isArray(s.members) || !Array.isArray(s.teams)) throw new Error('bad json');
  const idm = {};
  s.members.forEach(m=>{ idm[m.id] = {name:String(m.name||'').trim(), job:String(m.job||'').trim()}; });
  const ref = id=>idm[id] || null;
  return {
    members: s.members.map(m=>({name:String(m.name||'').trim(), job:String(m.job||'').trim()})),
    jobs: (s.jobs||[]).map(j=>({name:String(j.name||'').trim(), role:roleKey(j.role), icon:j.icon, color:j.color})),
    activities: (s.activities||[]).map(a=>({name:String(a.name||'').trim(), icon:a.icon})),
    teams: s.teams.map(t=>({
      name:t.name, activity:t.activity, size:t.size,
      parties:(t.parties||[]).map(p=>({name:p.name, slots:(p.slots||[]).map(ref), head:p.head?(p.slots||[]).indexOf(p.head):-1})),
      reserves:(t.reserves||[]).map(ref).filter(Boolean)
    }))
  };
}
function normalizeXLSX(wb){
  const S = v=>String(v==null?'':v).trim();
  const rows = n=>wb.Sheets[n] ? window.XLSX.utils.sheet_to_json(wb.Sheets[n], {defval:''}) : [];
  const inc = {members:[], jobs:[], activities:[], teams:[]}, tmap = {};
  const getT = name=>tmap[name] || (tmap[name] = inc.teams[inc.teams.push({name, activity:'', size:PS*NP, parties:[], reserves:[]})-1]);
  rows('สมาชิก').forEach(r=>{ if(S(r['ชื่อ'])) inc.members.push({name:S(r['ชื่อ']), job:S(r['อาชีพ'])}); });
  rows('อาชีพ').forEach(r=>{ if(S(r['อาชีพ'])) inc.jobs.push({name:S(r['อาชีพ']), role:roleKey(r['บทบาท']), color:S(r['สี'])}); });
  rows('กิจกรรม').forEach(r=>{ if(S(r['กิจกรรม'])) inc.activities.push({name:S(r['กิจกรรม']), icon:S(r['ไอคอน'])||'⭐'}); });
  rows('ทีม').forEach(r=>{
    if(!S(r['ชื่อทีม'])) return;
    const t = getT(S(r['ชื่อทีม'])); t.activity = S(r['กิจกรรม']);
    const n = parseInt(r['จำนวนคน'],10); if(SIZES.includes(n)) t.size = n;
  });
  rows('การจัดทีม').forEach(r=>{
    const tn = S(r['ชื่อทีม']), mn = S(r['ชื่อสมาชิก']); if(!tn || !mn) return;
    const t = getT(tn), ref = {name:mn, job:S(r['อาชีพ'])}, pv = S(r['ปาร์ตี้']);
    if(pv==='สำรอง'){ t.reserves.push(ref); return; }
    const p = parseInt(pv,10)-1; if(!(p>=0 && p<NP)) return;
    const pt = t.parties[p] || (t.parties[p] = {name:'', slots:Array(PS).fill(null), head:-1});
    if(S(r['ชื่อปาร์ตี้'])) pt.name = S(r['ชื่อปาร์ตี้']);
    let i = parseInt(r['ช่อง'],10)-1;
    if(!(i>=0 && i<PS) || pt.slots[i]) i = pt.slots.indexOf(null);
    if(i<0) return;
    pt.slots[i] = ref;
    const h = S(r['หัวหน้า']).toLowerCase();
    if(h && !['0','no','false','n','-'].includes(h)) pt.head = i;
  });
  return inc;
}
function ensureJob(name){
  if(name && !state.jobs.some(x=>x.name.toLowerCase()===name.toLowerCase())) state.jobs.push({name, role:'other'});
}
// เพิ่มข้อมูลที่นำเข้าเข้ากับข้อมูลเดิมเท่านั้น: ไม่ลบ ไม่ทับ ไม่แก้ทีมเดิม
function mergeIncoming(inc){
  const added = {members:0, teams:0, jobs:0, acts:0};
  const okIcon = v=>typeof v==='string' && /^data:image\//.test(v);
  (inc.jobs||[]).forEach(j=>{
    if(!j.name) return;
    const ex = state.jobs.find(x=>x.name.toLowerCase()===j.name.toLowerCase());
    if(!ex){ const o = {name:j.name, role:ROLES[j.role]?j.role:'other'}; if(okIcon(j.icon)) o.icon = j.icon; if(/^#[0-9a-f]{6}$/i.test(j.color||'')) o.color = j.color; state.jobs.push(o); added.jobs++; }
    else if(!ex.icon && okIcon(j.icon)) ex.icon = j.icon;
  });
  (inc.activities||[]).forEach(a=>{
    if(a && a.name && !state.activities.some(x=>x.name.toLowerCase()===a.name.toLowerCase())){ state.activities.push({name:a.name, icon:a.icon||'⭐'}); added.acts++; }
  });
  const key = (n,j)=>nameKey(n);
  const idx = {}; state.members.forEach(m=>{ idx[key(m.name,m.job)] = m.id; });
  const getId = (n,j)=>{
    n = String(n||'').trim().replace(/\s+/g,' ').slice(0,24); j = String(j||'').trim();
    if(!n) return null;
    if(!j) j = (state.jobs[0]||{}).name || '';
    const k = key(n,j);
    if(!idx[k]){ const id = uid(); state.members.push({id, name:n.slice(0,24), job:j}); idx[k] = id; added.members++; ensureJob(j); }
    return idx[k];
  };
  (inc.members||[]).forEach(m=>getId(m.name, m.job));
  const names = new Set(state.teams.map(t=>t.name.toLowerCase()));
  (inc.teams||[]).forEach(it=>{
    let name = String(it.name||'').trim() || 'ทีมนำเข้า';
    if(names.has(name.toLowerCase())){
      let k = 1, nn;
      do{ nn = name+' (นำเข้า'+(k>1?' '+k:'')+')'; k++; }while(names.has(nn.toLowerCase()));
      name = nn;
    }
    names.add(name.toLowerCase());
    let act = String(it.activity||'').trim() || state.activities[0].name;
    const ea = state.activities.find(a=>a.name.toLowerCase()===act.toLowerCase());
    if(ea) act = ea.name; else state.activities.push({name:act, icon:'⭐'});
    const t = newTeam(name.slice(0,30), act);
    const sz = +it.size; if(SIZES.includes(sz)) t.size = sz;
    const used = new Set();
    (it.parties||[]).forEach((ip,p)=>{
      if(!ip || p>=NP) return;
      const pt = t.parties[p];
      if(ip.name) pt.name = String(ip.name).slice(0,24);
      (ip.slots||[]).slice(0,PS).forEach((r,i)=>{
        if(!r) return;
        const id = getId(r.name, r.job);
        if(id && !used.has(id)){ used.add(id); pt.slots[i] = id; if(ip.head===i) pt.head = id; }
      });
    });
    (it.reserves||[]).forEach(r=>{
      const id = getId(r.name, r.job);
      if(id && !used.has(id) && t.reserves.length<MAXRES){ used.add(id); t.reserves.push(id); }
    });
    let need = 0; t.parties.forEach((pt,p)=>{ if(pt.slots.some(Boolean)) need = p+1; });
    if(need*PS > t.size) t.size = need*PS;
    state.teams.push(t); added.teams++;
  });
  return added;
}

  const core = Object.assign({}, s, {jobs});
  delete core.active;
  return {core, icons};
}
function applyShared(coreJson, iconsJson){
  const c = JSON.parse(coreJson), ic = JSON.parse(iconsJson||'{}');
  c.jobs = (c.jobs||[]).map(j=>ic[j.name] ? Object.assign({}, j, {icon:ic[j.name]}) : j);
  c.active = state.active;
  state = sanitize(c);
}

function isAdminUser(u){
  if(!u) return false;
  const list = (window.ADMIN_EMAILS||[]).map(x=>String(x).toLowerCase());
  if(!list.length) return true;   // UI hint only; Firestore rules are the real gate
  return list.includes(String(u.email||'').toLowerCase());
}

function setGate(kind, msg){
  const T = {
    error:['เชื่อมต่อฐานข้อมูลไม่สำเร็จ','<p class="help" style="font-size:14px;color:var(--ink)">'+esc(msg||'ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่')+'</p><div class="row"><button class="btn primary" id="gate-retry">ลองใหม่</button></div>']
  };
  const g = $('#gate'), c = T[kind]; if(!c) return;
  g.hidden = false;
  g.querySelector('h3').textContent = c[0];
  g.querySelector('.dlg-body').innerHTML = c[1];
  const b = $('#gate-retry'); if(b) b.onclick = ()=>location.reload();
}
function setSync(t){ const el = $('#sync'); if(el) el.textContent = t; }
function renderWho(){
  let h;
  if(cloud.mode==='local'){
    h = '<span class="pill adm">💾 โหมดเครื่องเดียว</span><span>ยังไม่ได้ตั้งค่า Firebase · ข้อมูลอยู่ในเครื่องนี้เท่านั้น</span>';
  } else if(canEdit){
    h = '<span class="pill adm">👑 ผู้ดูแล</span><span>'+esc((cloud.user&&cloud.user.email)||'')+'</span><span id="sync"></span><button class="btn sm" data-act="logout">ออกจากระบบ</button>';
  } else {
    h = '<span class="pill">👁 ดูอย่างเดียว</span><span id="sync"></span><button class="btn sm" data-act="login">เข้าสู่ระบบผู้ดูแล</button>';
  }
  $('#who').innerHTML = h;
}

function authMsg(err){
  const c = err && err.code;
  if(['auth/invalid-credential','auth/wrong-password','auth/user-not-found','auth/invalid-email'].includes(c)) return 'อีเมลหรือรหัสผ่านไม่ถูกต้อง';
  if(c==='auth/too-many-requests') return 'ลองผิดหลายครั้งเกินไป รอสักครู่แล้วลองใหม่';
  if(c==='auth/network-request-failed') return 'เชื่อมต่อเครือข่ายไม่ได้';
  if(c==='auth/operation-not-allowed') return 'ยังไม่ได้เปิดใช้การเข้าสู่ระบบด้วยอีเมลใน Firebase';
  return 'เข้าสู่ระบบไม่สำเร็จ';
}
function doLogin(){
  const e = $('#lg-e').value.trim(), p = $('#lg-p').value;
  if(!e || !p){ toast('กรอกอีเมลและรหัสผ่าน'); return false; }
  cloud.auth.signInWithEmailAndPassword(e, p)
    .then(()=>{ closeModal(); })
    .catch(err=>toast(authMsg(err)));
  return false;
}
function loginModal(){
  if(!cloud.auth){ toast('ยังไม่ได้ตั้งค่า Firebase'); return; }
  modal({title:'เข้าสู่ระบบผู้ดูแล',
    html:'<p class="help">เฉพาะผู้ดูแลเท่านั้นที่แก้ไขข้อมูลได้ ผู้ใช้ทั่วไปไม่ต้องเข้าสู่ระบบ เปิดดูข้อมูลได้เลย</p>'
      +'<label class="fld">อีเมล<input type="email" id="lg-e" autocomplete="username" inputmode="email"></label>'
      +'<label class="fld">รหัสผ่าน<input type="password" id="lg-p" autocomplete="current-password"></label>',
    buttons:[{label:'ยกเลิก'},{label:'เข้าสู่ระบบ',cls:'primary',fn:doLogin}],
    onOpen:()=>{
      $('#lg-e').focus();
      $('#lg-p').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
    }});
}
function doLogout(){
  if(!cloud.auth) return;
  cloud.auth.signOut().then(()=>toast('ออกจากระบบแล้ว'));
}

async function flush(){
  cloud.saveTimer = null;
  if(cloud.saving){ cloud.saveTimer = setTimeout(flush, 300); return; }
  if(!canEdit || !cloud.fs || !cloud.ready) return;
  const parts = splitState(state);
  const cj = JSON.stringify(parts.core), ij = JSON.stringify(parts.icons);
  if(cj===cloud.lastCore && ij===cloud.lastIcons){ setSync('บันทึกแล้ว'); return; }
  cloud.saving = true; setSync('กำลังบันทึก…');
  let ok = true;
  try{
    const now = Date.now(), by = (cloud.user && cloud.user.email) || null;
    if(cj!==cloud.lastCore){
      await cloud.fs.doc('planner/state').set({json:cj, updatedAt:now, by, sid:cloud.sid});
      cloud.lastCore = cj; cloud.pendingCore = null; cloud.remoteExists = true;
    }
    if(ij!==cloud.lastIcons){
      await cloud.fs.doc('planner/icons').set({json:ij, updatedAt:now, by, sid:cloud.sid});
      cloud.lastIcons = ij; cloud.pendingIcons = null;
    }
    setSync('บันทึกแล้ว '+hhmm());
  }catch(err){
    ok = false;
    setSync('บันทึกไม่สำเร็จ');
    const code = err && err.code;
    toast(code==='permission-denied' ? 'บันทึกไม่สำเร็จ · บัญชีนี้ไม่มีสิทธิ์เขียน (ตรวจสอบ Firestore rules และอีเมลผู้ดูแล)'
      : code==='invalid-argument' ? 'บันทึกไม่สำเร็จ · ข้อมูลใหญ่เกินไป (เกิน 1 MB)'
      : 'บันทึกไม่สำเร็จ · ตรวจสอบการเชื่อมต่อ');
  }
  cloud.saving = false;
  if(ok){
    const a = splitState(state);
    if(JSON.stringify(a.core)!==cloud.lastCore || JSON.stringify(a.icons)!==cloud.lastIcons) cloud.saveTimer = setTimeout(flush, 350);
  }
}

function scheduleApply(){
  clearTimeout(cloud.applyTimer);
  cloud.applyTimer = setTimeout(()=>{
    const busy = (drag && drag.active) || cloud.saveTimer || cloud.saving || (canEdit && !$('#modal').hidden);
    if(busy){ scheduleApply(); return; }
    const core = cloud.pendingCore || cloud.lastCore, icons = cloud.pendingIcons || cloud.lastIcons;
    cloud.pendingCore = null; cloud.pendingIcons = null;
    if(core===cloud.lastCore && icons===cloud.lastIcons) return;
    try{
      applyShared(core, icons);
      cloud.lastCore = core; cloud.lastIcons = icons;
      render();
      setSync('อัปเดตล่าสุด '+hhmm());
    }catch(e){}
  }, 400);
}
function subscribeShared(){
  const onErr = ()=>setSync('ขาดการเชื่อมต่อ · ข้อมูลอาจไม่ล่าสุด');
  cloud.fs.doc('planner/state').onSnapshot(snap=>{
    if(!snap.exists) return;
    const d = snap.data();
    if(!d || typeof d.json!=='string' || d.sid===cloud.sid || d.json===cloud.lastCore) return;
    cloud.remoteExists = true;
    cloud.pendingCore = d.json; scheduleApply();
  }, onErr);
  cloud.fs.doc('planner/icons').onSnapshot(snap=>{
    if(!snap.exists) return;
    const d = snap.data();
    if(!d || typeof d.json!=='string' || d.sid===cloud.sid || d.json===cloud.lastIcons) return;
    cloud.pendingIcons = d.json; scheduleApply();
  }, onErr);
}
function offerLocalMerge(local){
  setMerged();
  modal({title:'พบข้อมูลเก่าในเครื่องนี้',
    html:'<p class="help" style="font-size:14px;color:var(--ink)">เครื่องนี้มีข้อมูลที่บันทึกไว้ในเบราว์เซอร์ ('+local.members.length+' สมาชิก, '+local.teams.length+' ทีม) ต้องการรวมเข้ากับข้อมูลกลางไหม การรวมจะ <b>เพิ่ม</b> เข้าไป ไม่ลบหรือทับของเดิม (ถามครั้งเดียวบนเครื่องนี้)</p>',
    buttons:[{label:'ไม่ต้อง'},{label:'รวมข้อมูล',cls:'primary',fn:()=>{
      try{
        const a = mergeIncoming(normalizeJSON(local));
        render(); toast('รวมแล้ว · สมาชิกใหม่ '+a.members+' · ทีมใหม่ '+a.teams);
      }catch(e){ toast('รวมข้อมูลไม่สำเร็จ'); }
    }}]});
}
function adminReady(){
  const local = loadLocalSaved();
  if(!cloud.remoteExists){
    // first admin login on a brand-new database: create it from this device's data (or empty)
    if(local) state = local;
    setMerged();
    toast('สร้างฐานข้อมูลกลางแล้ว');
  } else if(local && !mergedFlag() && JSON.stringify(splitState(local).core)!==cloud.lastCore){
    offerLocalMerge(local);
  } else setMerged();
}
function onAuth(u){
  if(u && !isAdminUser(u)){
    toast('บัญชีนี้ไม่ได้รับสิทธิ์ผู้ดูแล');
    cloud.auth.signOut();
    return;
  }
  cloud.user = u;
  canEdit = !!u;
  document.body.classList.toggle('ro', !canEdit);
  if(!canEdit){ clearTimeout(cloud.saveTimer); cloud.saveTimer = null; }
  renderWho();
  if(canEdit) adminReady();
  render();
  if(canEdit) toast('เข้าสู่ระบบแล้ว · แก้ไขข้อมูลได้');
}

async function boot(){
  const rc = window.RO_CONFIG || {};
  const cfg = rc.firebase || {};
  window.ADMIN_EMAILS = rc.adminEmails || [];
  const configured = !!(cfg.apiKey && !/^YOUR_/i.test(cfg.apiKey));

  if(!configured){
    // single-device mode: data stays in this browser (handy for testing before Firebase is set up)
    cloud.mode = 'local'; canEdit = true;
    document.body.classList.remove('ro');
    state = load();
    cloud.ready = true; $('#gate').hidden = true;
    renderWho(); render();
    return;
  }
  if(!window.firebase){ setGate('error','โหลดไลบรารี Firebase ไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตหรือการบล็อกสคริปต์'); return; }

  cloud.mode = 'firebase';
  document.body.classList.add('ro');
  try{
    window.firebase.initializeApp(cfg);
    cloud.fs = window.firebase.firestore();
    cloud.auth = window.firebase.auth();
  }catch(e){ setGate('error','ค่า Firebase config ไม่ถูกต้อง'); return; }
  renderWho();

  let s1, s2;
  try{
    [s1, s2] = await withTimeout(Promise.all([cloud.fs.doc('planner/state').get(), cloud.fs.doc('planner/icons').get()]), 12000);
  }catch(e){
    setGate('error', (e && e.code==='permission-denied') ? 'ไม่มีสิทธิ์อ่านข้อมูล ตรวจสอบ Firestore rules' : 'ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่');
    return;
  }
  const d1 = s1.exists ? s1.data() : null;
  if(d1 && typeof d1.json==='string'){
    cloud.remoteExists = true;
    cloud.lastCore = d1.json;
    const d2 = s2.exists ? s2.data() : null;
    cloud.lastIcons = (d2 && typeof d2.json==='string') ? d2.json : '{}';
    applyShared(cloud.lastCore, cloud.lastIcons);
  } else {
    state = blankState();
    toast('ยังไม่มีข้อมูลทีม · รอผู้ดูแลเข้าสู่ระบบเพื่อสร้างข้อมูล');
  }
  cloud.ready = true; $('#gate').hidden = true;
  render(); setSync('เชื่อมต่อแล้ว');
  subscribeShared();
  cloud.auth.onAuthStateChanged(onAuth);
}

/* ---------- init ---------- */
try{ const th = localStorage.getItem(THEME_KEY); if(th==='dark'||th==='light') document.documentElement.dataset.theme = th; }catch(e){}
render();
boot();
})();
</script>
